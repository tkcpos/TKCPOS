<title>ເກັບຄ່າຂີ້ເຫຍື້ອ</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark-teal header band with tabs; each tab = toolbar row, summary strip, then a working table. Amber marks money still owed. */
:root {
  --bg: #F2F5F2; --surface: #FFFFFF; --sunk: #E8F0E6; --line: #D3DDD3;
  --fg: #102233; --muted: #4A5866;
  --brand: #2B7A2E; --brand-ink: #FFFFFF; --band: #0E3550; --band-fg: #F2F6F9; --band-muted: #B7C8D6; --orange: #E8820E;
  --owe: #A4520A; --owe-bg: #FDEFD9; --ok: #14532D; --ok-bg: #DCF2E4; --bad: #9F1239; --bad-bg: #FCE8EC; --off: #3E4A45; --off-bg: #E6EAE8;
  --font: "Noto Sans Lao", "Phetsarath OT", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C1714; --surface: #13211D; --sunk: #192B26; --line: #283D37; --fg: #E5EEEA; --muted: #A5BAB2;
  --brand: #5DB861; --brand-ink: #06170A; --band: #081F30; --band-fg: #F2F6F9; --band-muted: #A9BCCB; --orange: #F29A3A;
  --owe: #F2B266; --owe-bg: #3A2A12; --ok: #9BE0B2; --ok-bg: #173A26; --bad: #F6A3B4; --bad-bg: #3D1820; --off: #C2CCC8; --off-bg: #25312D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C1714; --surface: #13211D; --sunk: #192B26; --line: #283D37; --fg: #E5EEEA; --muted: #A5BAB2;
  --brand: #5DB861; --brand-ink: #06170A; --band: #081F30; --band-fg: #F2F6F9; --band-muted: #A9BCCB; --orange: #F29A3A;
  --owe: #F2B266; --owe-bg: #3A2A12; --ok: #9BE0B2; --ok-bg: #173A26; --bad: #F6A3B4; --bad-bg: #3D1820; --off: #C2CCC8; --off-bg: #25312D; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--owe); outline-offset: 2px }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.num { font-variant-numeric: tabular-nums } .mono { font-family: var(--mono); font-size: 13px }
.small { font-size: 12px; color: var(--muted) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

header.band { background: var(--band); color: var(--band-fg); border-bottom: 4px solid var(--brand); box-shadow: 0 3px 0 var(--orange) }
header.band .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-block: 12px }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 240px; min-width: 0 }
.mark { width: 48px; height: 46px; border-radius: 10px; background: #FFFFFF; object-fit: contain; flex: none; padding: 2px }
.brand b { display: block; font-size: 17px; line-height: 1.25 }
.brand span { font-size: 12px; color: var(--band-muted) }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: rgba(255,255,255,.08); padding: 4px; border-radius: 10px }
.tabs button { border: 0; background: transparent; color: var(--band-fg); min-height: 40px; padding: 0 14px; border-radius: 7px; cursor: pointer; font-weight: 600 }
.tabs button[aria-selected="true"] { background: var(--band-fg); color: var(--band) }
.who { display: flex; align-items: center; gap: 8px }
.who span { font-size: 13px; color: var(--band-muted) }
.ghostbtn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--band-fg); min-height: 40px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-weight: 600 }

main.wrap { padding-block: 20px 56px; display: flex; flex-direction: column; gap: 16px }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: space-between }
.toolbar .grp { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end }
h1 { font-size: 24px; margin: 0; line-height: 1.3; text-wrap: balance }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted) }
input, select, textarea { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 15px; width: 100% }
textarea { padding: 10px 12px; min-height: 64px; resize: vertical }
.toolbar input, .toolbar select { width: auto; min-width: 150px }
.btn { min-height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand) }
.btn.warn { color: var(--bad) }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px }
.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--sunk) }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.tiles > div { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px }
.tiles .k { font-size: 12px; font-weight: 600; color: var(--muted) }
.tiles .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3 }
.tiles .v.owe { color: var(--owe) } .tiles .v.ok { color: var(--brand) }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; margin-top: 6px }
.meter span { display: block; height: 100%; background: var(--brand) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0 }
.panel > h2 { font-size: 16px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line) }
.tablebox { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; background: var(--sunk); white-space: nowrap }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle }
th.r, td.r { text-align: right }
tr.off td { color: var(--muted) }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap }
.chip.paid { background: var(--ok-bg); color: var(--ok) } .chip.owe { background: var(--owe-bg); color: var(--owe) } .chip.off { background: var(--off-bg); color: var(--off) } .chip.ex { background: var(--sunk); color: var(--muted) }
.rowact { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px }
.status { font-size: 13px; color: var(--muted) }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--owe-bg); color: var(--owe); font-size: 14px }

dialog { border: 0; border-radius: 14px; padding: 0; width: min(720px, calc(100vw - 24px)); background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgba(0,0,0,.3) }
dialog::backdrop { background: rgba(4,20,15,.55) }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 40px) }
.dlg-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; background: var(--band); color: var(--band-fg); border-radius: 14px 14px 0 0 }
.dlg-h h2 { margin: 0; font-size: 18px }
.dlg-h .x { width: 44px; height: 44px; border-radius: 9px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: inherit; cursor: pointer; font-size: 18px }
.dlg-b { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px }
.dlg-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px }
.fgrid .wide { grid-column: 1 / -1 }
.err { color: var(--bad); font-size: 13px; margin: 0 }
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px }
.months label { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 9px; cursor: pointer; font-size: 14px }
.months label.done { background: var(--ok-bg); color: var(--ok); border-color: transparent; cursor: default }
.months input { width: 20px; min-height: 20px; height: 20px; accent-color: var(--brand) }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 10px; background: var(--sunk); font-weight: 700 }
.total .num { font-size: 24px }
.receipt { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px }
.receipt .rh { text-align: center; font-weight: 700; font-size: 16px }
.receipt .row { display: flex; justify-content: space-between; gap: 12px }

.infobar { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.infobox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; min-width: 0 }
.infobox .k { font-size: 12px; font-weight: 600; color: var(--muted) }
.infobox .v { font-size: 16px; font-weight: 700; overflow-wrap: anywhere }
.paygrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 16px; align-items: start }
@media (max-width: 920px) { .paygrid { grid-template-columns: minmax(0, 1fr) } .paygrid .entry { order: -1 } }
.ph { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--line) }
.ph h2 { font-size: 16px; margin: 0 }
.yearsel { width: auto; min-height: 40px }
table.grid th { color: #FFFFFF; background: var(--band) }
table.grid th:nth-child(odd) { background: var(--brand) }
table.grid td { padding: 6px 8px }
table.grid input, table.grid select { min-height: 40px; padding: 0 8px; font-size: 14px }
.payfoot { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line) }
.bigtotal { margin-left: auto; display: flex; align-items: center; gap: 14px; background: #0B3A12; color: #FFFFFF; border-radius: 10px; padding: 8px 16px }
.bigtotal span { font-size: 13px; color: #CFE6D2 }
.bigtotal strong { font-size: 32px; line-height: 1.1; min-width: 6ch; text-align: right }
.payact { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; padding: 0 16px 16px }
.btn.big { min-height: 52px; padding: 0 28px; font-size: 17px }
.btn:disabled { opacity: .5; cursor: not-allowed }
.dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center }
.dropzone.over { border-color: var(--brand); background: var(--sunk) }
.cols { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
.cols span { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--sunk) }
.warnlist { margin: 0; padding-left: 20px; font-size: 13px; color: var(--owe) }
.invprev { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--orange); color: #FFFFFF; font-size: 12px; line-height: 20px; text-align: center; margin-left: 4px }
.req { background: var(--surface); border: 1px solid var(--line); border-left-width: 1px; border-radius: 12px; display: flex; flex-direction: column }
.req .rh2 { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line) }
.req .rh2 strong { font-size: 16px }
.req .ra { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line) }
.steps { display: flex; gap: 6px; align-items: center; font-size: 13px }
.steps i { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted); border: 1.5px solid var(--line) }
.steps i.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand) }
del { color: var(--bad); text-decoration: line-through } ins { color: var(--ok); text-decoration: none; font-weight: 600 }
.slipbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 1 1 260px }
.slipbox img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in }
.slipbox .need { color: var(--owe); font-size: 12px; font-weight: 600 }
.slipview { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; margin: 0 auto; border-radius: 8px; background: #FFFFFF }
.invprev.thermal { width: auto; max-width: min(340px, 100%); display: block; margin: 0 auto; box-shadow: 0 4px 16px rgba(0,0,0,.12) }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--band); padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.login-card { width: min(420px, 100%); background: var(--surface); border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35) }
.login-card .mark { width: 120px; height: 110px; border-radius: 0; padding: 0 }
.wordmark { width: 220px; max-width: 100%; height: auto; border-radius: 8px; background: #FFFFFF; padding: 4px 8px }
.login-card h1 { font-size: 20px; margin-top: 6px }
.login-card form { width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: left }
.pin { letter-spacing: .35em; font-size: 20px; font-family: var(--mono) }
.linkbtn { background: none; border: 0; color: var(--brand); text-decoration: underline; cursor: pointer; min-height: 44px; font-weight: 600 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--band); color: var(--band-fg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20 }
@media (max-width: 560px) { h1 { font-size: 20px } .toolbar input, .toolbar select { min-width: 0; width: 100% } .toolbar .grp, .toolbar .grp > * { width: 100% } }
</style>

<script>
(() => {
/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Math.round(Number(n) || 0).toLocaleString("en-US");
const digits = (s) => Number(String(s ?? "").replace(/[^\d]/g, "")) || 0;
const pad = (n) => String(n).padStart(2, "0");
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const MON = ["ມັງກອນ", "ກຸມພາ", "ມີນາ", "ເມສາ", "ພຶດສະພາ", "ມິຖຸນາ", "ກໍລະກົດ", "ສິງຫາ", "ກັນຍາ", "ຕຸລາ", "ພະຈິກ", "ທັນວາ"];
const nowMonth = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const todayIso = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const mLabel = (m) => m ? MON[+m.slice(5) - 1] + " " + m.slice(0, 4) : "";
const dLabel = (d) => d ? (+d.slice(8)) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
const randId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const METHODS = { cash: "ເງິນສົດ", transfer: "ໂອນເງິນ", qr: "QR" };
const DEF_TYPES = [{ id: "home", name: "ເຮືອນ / ຄອບຄົວ", fee: 20000 }, { id: "shop", name: "ຮ້ານຄ້າ", fee: 50000 }, { id: "food", name: "ຮ້ານອາຫານ", fee: 100000 }, { id: "biz", name: "ບໍລິສັດ / ໂຮງງານ", fee: 200000 }];
let toastT; const toast = (m) => { const el = $("toast"); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 1800); };
const openDlg = (id) => { try { $(id).showModal(); } catch (e) { $(id).setAttribute("open", ""); } };
const closeDlg = (id) => { try { $(id).close(); } catch (e) { $(id).removeAttribute("open"); } };

/* ---------- state ---------- */
const state = {
  tab: "pay", pSlip: null, pCust: null, pYear: new Date().getFullYear(), pRows: [], pMethod: "cash", pErr: "", saving: false, month: nowMonth(), village: "all", q: "", filter: "all", custVillage: "all", rMonth: nowMonth(),
  config: null, villages: {}, pay: {}, payYear: null,
  staff: null, staffErr: false, me: null, isOwner: false, loginMode: "login", fails: 0, lockUntil: 0, pinFor: null, rmFor: null,
  payFor: null, receipt: null, confirm: null, requests: {}
};
const NEED_APPROVALS = 2;
const isAdmin = () => !!(state.me && state.me.role === "admin");
const cfg = () => ({ company: "", phone: "", types: DEF_TYPES, ...(state.config || {}) });
const typeOf = (id) => cfg().types.find((x) => x && x.id === id);
const feeOf = (c) => Number(c.f) || (typeOf(c.t) || {}).fee || 0;
const companyName = () => cfg().company || "T²CN Thakhek";

/* ---------- storage (shared db, or this device as a fallback) ---------- */
let db = null;
const deepMerge = (a, b) => { const o = { ...(a || {}) }; for (const k in b) { const v = b[k]; o[k] = v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" ? deepMerge(o[k], v) : v; } return o; };
const local = { data: (() => { try { return JSON.parse(store.get("wf-db") || "{}") } catch (e) { return {} } })(), save() { store.set("wf-db", JSON.stringify(this.data)); } };
async function setDoc(path, data) { if (db) return db.doc(path).set(data); local.data[path] = data; local.save(); localRefresh(); }
async function mergeDoc(path, data, init) {
  if (db) {
    try { await db.doc(path).update(data); }
    catch (e) { if (e && e.code === "invalid_argument") await db.doc(path).set(deepMerge(init || {}, data)); else throw e; }
    return;
  }
  local.data[path] = deepMerge(local.data[path] || init || {}, data); local.save(); localRefresh();
}
async function delDoc(path) { if (db) return db.doc(path).delete(); delete local.data[path]; local.save(); localRefresh(); }
function localRefresh() {
  state.config = local.data["settings/config"] || null;
  state.staff = (local.data["settings/staff"] || {}).list || [];
  const v = {}, p = {};
  const q = {};
  Object.keys(local.data).forEach((k) => { if (k.startsWith("villages/")) v[k.slice(9)] = local.data[k]; if (k.startsWith("pay/")) p[k.slice(4)] = local.data[k]; if (k.startsWith("requests/")) q[k.slice(9)] = local.data[k]; });
  state.villages = v; state.pay = p; state.requests = q; syncSession(); renderAll();
}
let payUnsub = null;
function watchPay(year) {
  if (!db || state.payYear === year) return;
  state.payYear = year;
  if (payUnsub) payUnsub();
  payUnsub = db.collection("pay").where("year", "==", year).onSnapshot((s) => { const p = {}; s.docs.forEach((d) => (p[d.id] = d.data())); state.pay = p; renderAll(); }, () => {});
}
function watchAll() {
  if (!db) { localRefresh(); return; }
  db.doc("settings/config").onSnapshot((s) => { state.config = s.exists ? s.data() : null; renderAll(); }, () => {});
  db.doc("settings/staff").onSnapshot((s) => { state.staffErr = false; state.staff = s.exists ? (s.data().list || []) : []; syncSession(); renderAll(); }, () => { state.staffErr = true; renderAll(); });
  db.collection("villages").onSnapshot((s) => { const v = {}; s.docs.forEach((d) => (v[d.id] = d.data())); state.villages = v; renderAll(); }, () => {});
  db.collection("requests").orderBy("at", "desc").limit(300).onSnapshot((s) => { const q = {}; s.docs.forEach((d) => (q[d.id] = d.data())); state.requests = q; renderAll(); }, () => {});
  watchPay(+state.month.slice(0, 4));
}
const yearOfView = () => state.tab === "pay" ? state.pYear : +(state.tab === "report" ? state.rMonth : state.month).slice(0, 4);

/* ---------- data views ---------- */
const villageList = () => Object.entries(state.villages).filter(([, v]) => v && v.name).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
function customers() {
  const out = [];
  villageList().forEach((v) => Object.entries(v.customers || {}).forEach(([id, c]) => { if (c) out.push({ ...c, id, vid: v.id, vname: v.name }); }));
  return out.sort((a, b) => a.vname.localeCompare(b.vname) || String(a.c || "").localeCompare(String(b.c || ""), undefined, { numeric: true }));
}
const paidRec = (m, vid, cid) => { const d = state.pay[m + "_" + vid]; const r = d && d.paid ? d.paid[cid] : null; return r || null; };
const activeIn = (c, m) => !c.x && (!c.s || c.s <= m);
function unpaidMonths(c, upto) {
  if (c.x) return [];
  const y = upto.slice(0, 4), first = c.s && c.s > y + "-01" ? c.s : y + "-01", out = [];
  if (first.slice(0, 4) !== y) return out;
  for (let i = +first.slice(5); i <= +upto.slice(5); i++) { const m = y + "-" + pad(i); if (!paidRec(m, c.vid, c.id)) out.push(m); }
  return out;
}
function stats(m, vid) {
  const o = { n: 0, exp: 0, got: 0, paidN: 0 };
  customers().forEach((c) => {

let slipTarget = "pay";
async function toSlip(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error("type");
  const url = URL.createObjectURL(file), img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; }); } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  let max = 1200, out = "";

    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const g = cv.getContext("2d"); g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    for (let q = 0.8; q >= 0.4; q -= 0.1) { out = cv.toDataURL("image/jpeg", q); if (out.length < 220000) return out; }
    max = Math.round(max * 0.75);

  if (out.length < 240000) return out;

}

  if (act === "savepin") { const pin = $("np").value; if (!pinOk(pin)) { $("s-err").textContent = "PIN ຕ້ອງເປັນຕົວເລກ 4 ຫາ 6 ໂຕ."; $("s-err").hidden = false; return; }
    const salt = randId("k"), hash = await hashPin(pin, salt); await saveStaff(state.staff.map((u) => u.id === id ? { ...u, salt, hash } : u)); state.pinFor = null; renderStaff(); toast("ບັນທຶກ PIN ແລ້ວ"); }
  if (act === "askrm") { state.rmFor = id; state.pinFor = null; renderStaff(); }
  if (act === "rm") { const rest = state.staff.filter((u) => u.id !== id); if (!rest.some((u) => u.role === "admin")) { $("s-err").textContent = "ຕ້ອງມີຜູ້ບໍລິຫານຢ່າງໜ້ອຍ 1 ຄົນ."; $("s-err").hidden = false; return; } await saveStaff(rest); state.rmFor = null; renderStaff(); toast("ລຶບແລ້ວ"); }
});
